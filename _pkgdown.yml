url: https://ccarbajal16.github.io/soilquality/

logo: man/figures/logo.png

template:
  bootstrap: 5
  bootswatch: cosmo
  theme: arrow-light
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

home:
  title: "soilquality: Soil Quality Index Calculation"
  description: >
    R package for calculating Soil Quality Index (SQI) using PCA for MDS selection
    and AHP for expert-based weighting.

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Building and validating a Soil Quality Index
        href: articles/building-and-validating-an-sqi.html
      - text: Introduction to soilquality
        href: articles/introduction.html
      - text: Advanced Usage
        href: articles/advanced-usage.html
      - text: AHP Matrices Guide
        href: articles/ahp-matrices.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/ccarbajal16/soilquality

reference:
- title: Main SQI Computation
  desc: >
    Core functions for computing Soil Quality Index with different workflows
  contents:
  - compute_sqi
  - compute_sqi_df
  - compute_sqi_properties

- title: Data Handling
  desc: >
    Functions for importing and preprocessing soil data
  contents:
  - read_soil_csv
  - standardize_numeric
  - to_numeric

- title: MDS Selection
  desc: >
    Selecting a Minimum Data Set, by variance (PCA) or by centrality
    (correlation network)
  contents:
  - pca_select_mds
  - pca_adequacy
  - na_select_mds
  - mds_consensus

- title: Functional Grouping
  desc: >
    Selecting one indicator per soil function (EMDS) rather than across the
    whole pool
  contents:
  - soil_function_groups
  - assign_function_groups

- title: AHP Weighting
  desc: >
    Analytic Hierarchy Process for expert-based indicator weighting
  contents:
  - ahp_weights
  - create_ahp_matrix
  - ratio_to_saaty

- title: Scoring Functions
  desc: >
    Functions for transforming soil properties into quality scores
  contents:
  - score_indicators
  - score_higher_better
  - score_lower_better
  - score_optimum
  - score_threshold
  - score_sigmoid

- title: Scoring Constructors
  desc: >
    Object-oriented constructors for scoring rules
  contents:
  - higher_better
  - lower_better
  - optimum_range
  - threshold_scoring
  - sigmoid_scoring
  - reference_scoring

- title: Reference-Soil Standardisation
  desc: >
    Scoring against an undisturbed reference soil, the documented escape from
    index incomparability
  contents:
  - standardize_to_reference
  - sensitivity_resistance

- title: Aggregation
  desc: >
    Combining scored indicators into a single index
  contents:
  - sqi_area

- title: Validation
  desc: >
    Assessing whether an index actually discriminates, and whether a
    conclusion survives a change of recipe
  contents:
  - sqi_validate
  - sqi_stability

- title: Property Sets and Standard Rules
  desc: >
    Pre-defined property collections and automatic scoring rules
  contents:
  - soil_property_sets
  - standard_scoring_rules

- title: Visualization
  desc: >
    Functions for plotting and visualizing SQI results
  contents:
  - plot.sqi_result
  - plot_sqi_report
  - plot_sqi_validation

- title: Interactive Tools
  desc: >
    Shiny-based interactive applications
  contents:
  - run_sqi_app

- title: Example Data
  desc: >
    Two datasets, for two different jobs. `soil_data` for scoring, weighting
    and aggregation; `soil_structured` for anything that reads the structure
    between indicators.
  contents:
  - soil_data
  - soil_structured

- title: Print Methods
  desc: >
    S3 print methods for custom objects
  contents:
  - print.ahp_matrix
  - print.scoring_rule
  - print.sqi_validation
  - print.sqi_stability
  - print.pca_adequacy

articles:
- title: Getting Started
  navbar: ~
  contents:
  - building-and-validating-an-sqi
  - introduction

- title: Advanced Topics
  navbar: ~
  contents:
  - advanced-usage
  - ahp-matrices

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: Developed by Carlos Carbajal
    built_with: Built with [pkgdown](https://pkgdown.r-lib.org/)
